[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# URL берётся из DATABASE_URL / config.env в migrations/env.py, пароль в git не хранится.
sqlalchemy.url = driver://not-used

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
