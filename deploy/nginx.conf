# /etc/nginx/sites-available/meteksochi
# 1) заменить example.ru на домен; 2) certbot --nginx -d example.ru -d www.example.ru;
# 3) после появления HTTPS раскомментировать HSTS.
# В nginx.conf (http{}) добавить: server_tokens off;
#   limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
#   limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name example.ru www.example.ru;

    root /srv/metek/site;
    index index.html;

    # ── заголовки безопасности статики ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src https://yandex.ru https://*.yandex.ru; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── чистые URL: /katalog -> katalog.html, старые /katalog.html -> 301 /katalog ──
    location = /index.html { return 301 /; }
    location = /index      { return 301 /; }
    location ~ ^/(.+)\.html$ { return 301 /$1; }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location ~ /\. { deny all; }                 # .git, .env и т.п.
    location ~* \.(py|bat|md|txt|ods|xlsx)$ { deny all; }

    # Старый URL оставлен, но содержимое теперь всегда получается из PostgreSQL.
    location = /prices.json {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Sprint 1: каталог отдаётся FastAPI/Jinja2 из PostgreSQL, а не site/katalog.html.
    location = /katalog {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /katalog/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── бэкенд ──
    location /api/ {
        limit_req zone=api burst=5 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/upload/(login|totp)$ {
        limit_req zone=login burst=3 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /upload {
        # рекомендую сузить: allow <IP офиса>; allow <IP VPN>; deny all;
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:8100; }
}
